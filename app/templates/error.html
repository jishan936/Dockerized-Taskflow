{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<section class="empty-state">
  <div class="empty-icon"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></div>
  <h1 class="h4">{{ code }}</h1>
  <p class="text-muted mb-3">{{ message }}</p>
  <a class="btn btn-accent" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
</section>
{% endblock %}
